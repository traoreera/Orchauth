name: auth
version: 1.0.0
author: xcore
description: >
  Plugin d'authentification enterprise — multi-tenant, RBAC, audit log,
  invitations par lien, MFA TOTP, JWT RS256, OAuth (Google/GitHub/Discord/Microsoft).

execution_mode: trusted
entry_point: src/main.py
framework_version: ">=2.0.0"

# Qui peut appeler les actions d'xauth par IPC (l'hôte active `enforce_ipc`) : le moteur de DocTypes lit l'annuaire des membres d'une organisation
# (`xauth.users.list.tenant`, voir src/xcore_doctype/directory.py), le plugin `iam` gère les accès par les actions `xauth.iam.*` (services/iam.py : xauth
# juge l'acteur) et `hr` ferme le compte d'un employé qui part (app/hr/src/access.py). Pas de joker : un plugin qui veut lire l'annuaire ou les accès est nommé ici.
allowed_callers: ["xcore-doctype", "iam", "hr", "xflow", "xlicense"]  # xflow : re-résout l'identité d'un travail différé (xauth.user.permissions) ; xlicense : juge qui peut voir/gérer la licence d'une organisation (xauth.tenant_access)

# ── Application ───────────────────────────────────────────────────────────────
app:
  name: "XAuth"
  base_url: "http://localhost:8000"  # liens d'invitation et redirections OAuth : à régler sur l'adresse publique de votre hôte
  # desk_url: "http://localhost:8000/app/xcore-doctype/desk/"  # pages web des liens d'e-mail (invitation, réinitialisation) ; défaut : base_url + le préfixe `/app` de ce dépôt. Surchargeable par XAUTH_DESK_URL.

# ── Seed — tenant et compte admin créés au démarrage ─────────────────────────
# Toutes les valeurs sont overridables via les variables d'environnement
# correspondantes (ADMIN_EMAIL, ADMIN_PASSWORD, etc.)
# ADMIN_EMAIL et ADMIN_PASSWORD n'ont AUCUNE valeur par défaut ici : le démarrage échoue sans eux (jamais de mot de passe commité). `make env` les
# écrit dans `.env` (mot de passe aléatoire) ; en production, ce sont des secrets de l'hôte.
seed:
  admin_tenant_slug: "default"
  admin_tenant_name: "Default"
  admin_role_name: "admin"
  user_role_name: "user"

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt:
  private_key_path: "conf/private.pem"
  public_key_path: "conf/public.pem"
  access_expire_minutes: 15
  refresh_expire_days: 7

# ── Rate limiting ─────────────────────────────────────────────────────────────
# Limites par route — format: "/chemin": [max_requetes, fenetre_secondes]
# Mettre enabled: false pour désactiver en développement.
rate_limit:
  enabled: true
  routes: {}

# ── Variables d'environnement ─────────────────────────────────────────────────
# Réservées aux secrets qui ne doivent PAS apparaître en clair dans ce fichier.
# Les valeurs des sections app/seed/jwt ci-dessus prennent le dessus si la
# variable d'env est absente ou vide.


# Variables d'environnement de l'hôte lues par xauth. xcore n'accepte que la forme exacte `${VAR}` et REFUSE le plugin si la variable n'existe pas : on ne
# liste donc ici que ce qui est toujours défini (`make env` écrit `.env` ; `app.dotenv: ./.env` d'`integration.yaml` le charge, et un déploiement exporte
# ses secrets). ADMIN_EMAIL et ADMIN_PASSWORD sont des SECRETS : jamais de valeur en clair ici, seulement l'indirection vers l'environnement.
# Pour activer une fonction optionnelle, ajoutez sa ligne ET exportez la variable :
#   ADMIN_USERNAME   (nom d'utilisateur de l'administrateur ; sans lui, il est dérivé de son adresse : admin@acme.test -> admin)
#   ADMIN_TENANT_SLUG / ADMIN_TENANT_NAME / ADMIN_ROLE_NAME / USER_ROLE_NAME   (valeurs par défaut : section `seed:`)
#   JWT_PRIVATE_KEY_PATH / JWT_PUBLIC_KEY_PATH / JWT_ACCESS_EXPIRE_MINUTES / JWT_REFRESH_EXPIRE_DAYS   (défauts : section `jwt:`)
#   OAUTH_GOOGLE_CLIENT_ID, OAUTH_GOOGLE_CLIENT_SECRET (idem GITHUB, DISCORD, MICROSOFT), OAUTH_TOKEN_KEY (clé Fernet), OAUTH_WEB_REDIRECT_ORIGINS
env:
  ADMIN_EMAIL: ${ADMIN_EMAIL}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD}

events_emitted:
  xauth.auth.registered:
    description: "Utilisateur inscrit avec succès"
    payload_schema:
      user_id: string
      email: string
      tenant_id: string
  xauth.auth.login:
    description: "Connexion réussie"
    payload_schema:
      user_id: string
      email: string
      ip: string
      tenant_id: string
  xauth.auth.login_failed:
    description: "Tentative de connexion échouée"
    payload_schema:
      email: string
      ip: string
      reason: string
  xauth.auth.logout:
    description: "Déconnexion utilisateur"
    payload_schema:
      user_id: string
  xauth.auth.session_refreshed:
    description: "Session JWT rafraîchie"
    payload_schema:
      user_id: string
      tenant_id: string
  xauth.password.reset_requested:
    description: "Demande de réinitialisation de mot de passe"
    payload_schema:
      email: string
  xauth.password.reset_completed:
    description: "Réinitialisation de mot de passe effectuée"
    payload_schema:
      email: string
  xauth.password.changed:
    description: "Mot de passe modifié par l'utilisateur"
    payload_schema:
      user_id: string
  xauth.password.set:
    description: "Mot de passe défini (première fois)"
    payload_schema:
      user_id: string
  xauth.oauth.login:
    description: "Connexion via OAuth"
    payload_schema:
      user_id: string
      provider: string
      is_new_user: boolean
  xauth.oauth.linked:
    description: "Compte OAuth lié à un compte existant"
    payload_schema:
      user_id: string
      provider: string
  xauth.oauth.unlinked:
    description: "Compte OAuth délié"
    payload_schema:
      user_id: string
      provider: string
  xauth.invite.created:
    description: "Invitation créée et envoyée"
    payload_schema:
      invite_id: string
      email: string
      tenant_id: string
      invited_by: string
  xauth.invite.accepted:
    description: "Invitation acceptée"
    payload_schema:
      invite_id: string
      user_id: string
      tenant_id: string
  xauth.tenant.created:
    description: "Nouveau tenant créé"
    payload_schema:
      tenant_id: string
      owner_id: string
      slug: string
  xauth.mfa.enabled:
    description: "MFA TOTP activé"
    payload_schema:
      user_id: string
  xauth.mfa.disabled:
    description: "MFA TOTP désactivé"
    payload_schema:
      user_id: string

# ── Permissions inter-plugins ─────────────────────────────────────────────────
permissions:
  - resource: "registry"
    actions: ["*"]
    effect: allow
  - resource: "xauth.*"
    actions: ["*"]
    effect: allow

# ── Ressources ────────────────────────────────────────────────────────────────
resources:
  timeout_seconds: 30
  max_memory_mb: 256
  rate_limit:
    calls: 1000
    period_seconds: 60

# ── Runtime ───────────────────────────────────────────────────────────────────
runtime:
  health_check:
    enabled: true
    interval_seconds: 60
    timeout_seconds: 5
  retry:
    max_attempts: 3
    backoff_seconds: 2.0
